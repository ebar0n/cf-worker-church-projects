name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  adventurers:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adventurers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: yarn install --frozen-lockfile
      - run: node --check src/index.js
      - run: node --check public/shared/profile.js
      - run: yarn verify
